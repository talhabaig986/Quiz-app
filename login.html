<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <link rel="icon"
        href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6/svgs/solid/graduation-cap.svg">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;

            background:
                radial-gradient(circle at top, #4a2600, transparent 35%),
                linear-gradient(135deg, #080808, #17120c);

            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .box {
            width: 100%;
            max-width: 400px;
            padding: 30px;

            border-radius: 22px;

            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(18px);

            border: 1px solid rgba(245, 158, 11, 0.35);

            box-shadow: 0 0 40px rgba(245, 158, 11, 0.12);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #fbbf24;
        }

        .field {
            display: flex;
            align-items: center;
            gap: 10px;

            margin-bottom: 15px;
            padding: 13px 15px;

            background: rgba(255, 255, 255, 0.08);

            border: 1px solid rgba(255, 255, 255, 0.15);

            border-radius: 12px;
        }

        .field i {
            color: #f59e0b;
            font-size: 17px;
            width: 20px;
            text-align: center;
        }

        input {
            width: 100%;

            border: none;
            outline: none;

            background: transparent;
            color: white;

            font-size: 15px;
            font-weight: bold;
        }

        input::placeholder {
            color: #cfcfcf;
            font-weight: normal;
        }

        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus {
            -webkit-text-fill-color: white;
            -webkit-box-shadow: 0 0 0px 1000px transparent inset;
            transition: background-color 5000s ease-in-out 0s;
        }

        button {
            width: 100%;
            padding: 13px;

            border: none;
            border-radius: 12px;

            background: linear-gradient(135deg, #f97316, #f59e0b);

            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>Login</h1>

        <form id="loginForm">

            <div class="field">
                <i class="fa-solid fa-envelope"></i>

                <input
                    type="email"
                    id="email"
                    placeholder="Email"
                    required
                >
            </div>

            <div class="field">
                <i class="fa-solid fa-lock"></i>

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >
            </div>

            <button type="submit">
                <i class="fa-solid fa-right-to-bracket"></i>
                Login
            </button>

        </form>

    </div>

    <script>
        document.getElementById("loginForm")
        .addEventListener("submit", function(e) {

            e.preventDefault();

            let email =
                document.getElementById("email").value;

            let password =
                document.getElementById("password").value;

            let users =
                JSON.parse(localStorage.getItem("users")) || [];

            let user = users.find(function(user) {

                return user.email == email &&
                       user.password == password;

            });

            if (user) {

                localStorage.setItem(
                    "currentUser",
                    JSON.stringify(user)
                );

                window.location.href = "quiz.html";

            } else {

                alert("Invalid email or password");

            }
        });
    </script>

</body>
</html>
