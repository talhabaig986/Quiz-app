<!DOCTYPE html>
<html>
<head>
    <title>Quiz</title>

    <link rel="icon"
        href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6/svgs/solid/graduation-cap.svg">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;

            background:
                radial-gradient(circle at top, #4a2600, transparent 35%),
                linear-gradient(135deg, #080808, #17120c);

            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .box {
            width: 100%;
            max-width: 700px;
            padding: 30px;

            border-radius: 22px;

            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(18px);

            border: 1px solid rgba(245, 158, 11, 0.35);

            box-shadow: 0 0 40px rgba(245, 158, 11, 0.12);
        }

        h1 {
            text-align: center;
            color: #fbbf24;
            margin-bottom: 10px;
        }

        #timer {
            text-align: center;
            color: #f59e0b;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        #qno {
            color: #fbbf24;
            font-weight: bold;
        }

        #question {
            font-size: 20px;
            margin: 15px 0;
        }

        .option {
            display: block;
            width: 100%;

            padding: 14px;
            margin: 10px 0;

            border-radius: 12px;

            background: rgba(255, 255, 255, 0.08);

            border: 1px solid rgba(255, 255, 255, 0.15);

            color: white;

            cursor: pointer;

            font-weight: bold;

            transition: 0.2s;
        }

        .option:hover {
            background: rgba(120, 65, 5, 0.45);
        }

        .option.selected {
            background: rgba(20, 50, 90, 0.9);
            border-color: #2563eb;
            box-shadow: 0 0 10px rgba(37, 99, 235, 0.25);
        }

        #nextBtn {
            width: 100%;
            padding: 13px;

            margin-top: 15px;

            border: none;
            border-radius: 12px;

            background: linear-gradient(135deg, #f97316, #f59e0b);

            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        #nextBtn:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>
            <i class="fa-solid fa-graduation-cap"></i>
            Web Development Quiz
        </h1>

        <div id="timer">20:00</div>

        <div id="qno"></div>

        <div id="question"></div>

        <div id="options">

            <button class="option"></button>
            <button class="option"></button>
            <button class="option"></button>
            <button class="option"></button>

        </div>

        <button id="nextBtn">Next</button>

    </div>

    <script>

        let questions = [

            {
                question: "HTML stands for?",
                options: [
                    "Hyper Text Markup Language",
                    "High Text Machine Language",
                    "Hyperlink Text Mark Language",
                    "Home Tool Markup Language"
                ],
                answer: 0
            },

            {
                question: "CSS stands for?",
                options: [
                    "Computer Style Sheets",
                    "Cascading Style Sheets",
                    "Creative Style System",
                    "Colorful Style Sheets"
                ],
                answer: 1
            },

            {
                question: "JS stands for?",
                options: [
                    "JavaScript",
                    "JavaStyle",
                    "JustScript",
                    "JavaSystem"
                ],
                answer: 0
            },

            {
                question: "Which tag is used for the main heading?",
                options: [
                    "<h1>",
                    "<head>",
                    "<heading>",
                    "<h6>"
                ],
                answer: 0
            },

            {
                question: "Which tag is used for paragraph?",
                options: [
                    "<para>",
                    "<p>",
                    "<paragraph>",
                    "<text>"
                ],
                answer: 1
            },

            {
                question: "Which language is used for styling?",
                options: [
                    "HTML",
                    "JavaScript",
                    "CSS",
                    "Python"
                ],
                answer: 2
            },

            {
                question: "Which language creates web page structure?",
                options: [
                    "CSS",
                    "HTML",
                    "JavaScript",
                    "SQL"
                ],
                answer: 1
            },

            {
                question: "Which symbol is used for ID selector in CSS?",
                options: [
                    ".",
                    "#",
                    "*",
                    "@"
                ],
                answer: 1
            },

            {
                question: "Which symbol is used for class selector in CSS?",
                options: [
                    "#",
                    ".",
                    "*",
                    "$"
                ],
                answer: 1
            },

            {
                question: "Which keyword can declare a variable in JavaScript?",
                options: [
                    "var",
                    "let",
                    "const",
                    "All of these"
                ],
                answer: 3
            },

            {
                question: "Which method selects an element by ID?",
                options: [
                    "getElementById()",
                    "getById()",
                    "selectId()",
                    "queryId()"
                ],
                answer: 0
            },

            {
                question: "Which method selects multiple elements?",
                options: [
                    "querySelectorAll()",
                    "queryAll()",
                    "getAll()",
                    "selectAll()"
                ],
                answer: 0
            },

            {
                question: "Which tag creates a button?",
                options: [
                    "<btn>",
                    "<button>",
                    "<click>",
                    "<input>"
                ],
                answer: 1
            },

            {
                question: "Which tag is used for images?",
                options: [
                    "<image>",
                    "<pic>",
                    "<img>",
                    "<photo>"
                ],
                answer: 2
            },

            {
                question: "Which tag creates a link?",
                options: [
                    "<link>",
                    "<a>",
                    "<href>",
                    "<url>"
                ],
                answer: 1
            },

            {
                question: "Which property gets visible text from an element?",
                options: [
                    "innerText",
                    "innerValue",
                    "textValue",
                    "textContentOnly"
                ],
                answer: 0
            },

            {
                question: "Which function repeats code after a fixed time?",
                options: [
                    "setTimeout()",
                    "setInterval()",
                    "repeatCode()",
                    "loopTime()"
                ],
                answer: 1
            },

            {
                question: "Which operator checks value and data type?",
                options: [
                    "==",
                    "=",
                    "===",
                    "!="
                ],
                answer: 2
            },

            {
                question: "Which data type stores multiple values?",
                options: [
                    "String",
                    "Boolean",
                    "Array",
                    "Number"
                ],
                answer: 2
            },

            {
                question: "Which data type stores true or false?",
                options: [
                    "String",
                    "Boolean",
                    "Array",
                    "Object"
                ],
                answer: 1
            }

        ];


        let currentQuestion = 0;
        let score = 0;
        let time = 1200;


        let qno =
            document.getElementById("qno");

        let question =
            document.getElementById("question");

        let options =
            document.querySelectorAll(".option");

        let nextBtn =
            document.getElementById("nextBtn");

        let timer =
            document.getElementById("timer");


        function showQuestion() {

            let q =
                questions[currentQuestion];

            qno.innerText =
                "Question " +
                (currentQuestion + 1) +
                " / " +
                questions.length;

            question.innerText =
                q.question;


            options.forEach(
                function(option, index) {

                    option.innerText =
                        q.options[index];

                    option.dataset.answer =
                        index;

                    option.classList.remove(
                        "selected"
                    );

                }
            );


            nextBtn.innerText =
                currentQuestion ==
                questions.length - 1
                ? "Finish"
                : "Next";
        }


        options.forEach(
            function(option) {

                option.addEventListener(
                    "click",
                    function() {

                        options.forEach(
                            function(item) {

                                item.classList.remove(
                                    "selected"
                                );

                            }
                        );


                        option.classList.add(
                            "selected"
                        );

                    }
                );

            }
        );


        nextBtn.addEventListener(
            "click",
            function() {

                let selected =
                    document.querySelector(
                        ".option.selected"
                    );


                if (!selected) {

                    alert(
                        "Please select an answer"
                    );

                    return;
                }


                if (
                    Number(
                        selected.dataset.answer
                    ) ==
                    questions[currentQuestion].answer
                ) {

                    score++;

                }


                currentQuestion++;


                if (
                    currentQuestion >=
                    questions.length
                ) {

                    localStorage.setItem(
                        "score",
                        score
                    );

                    localStorage.setItem(
                        "total",
                        questions.length
                    );

                    window.location.href =
                        "result.html";

                } else {

                    showQuestion();

                }

            }
        );


        setInterval(
            function() {

                time--;

                let minutes =
                    Math.floor(time / 60);

                let seconds =
                    time % 60;


                if (seconds < 10) {

                    seconds =
                        "0" + seconds;

                }


                timer.innerText =
                    minutes +
                    ":" +
                    seconds;


                if (time <= 0) {

                    localStorage.setItem(
                        "score",
                        score
                    );

                    localStorage.setItem(
                        "total",
                        questions.length
                    );

                    window.location.href =
                        "result.html";

                }

            },
            1000
        );


        showQuestion();

    </script>

</body>
</html>
